<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Nightwater app icon (master). One flume mouth glowing on the waterline.
    Variants are switched by scripts/build-art.mjs:
      tile   rounded tile, transparent corners (favicon, launcher "any" icons)
      square full-bleed square (apple-touch-icon, maskable icons)
    At 40 px and below the media query below simplifies the mark: browsers evaluate it
    against the rendered size, so the same file serves as the 16 px tab favicon.
    The mark stays inside the maskable safe zone (centre circle, 80 % of the width).
  -->
  <title>Nightwater</title>
  <style>
    @media (max-width: 40px) {
      #stars, #nebula, #arcs, #hot, #ripples { display: none }
      #ring { stroke-width: 42 }
      #haze { stroke-width: 54; opacity: .55 }
      #reflection { opacity: .5 }
    }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2f3a"/>
      <stop offset=".55" stop-color="#071b25"/>
      <stop offset="1" stop-color="#040b13"/>
    </linearGradient>
    <radialGradient id="nebula-violet" cx=".26" cy=".16" r=".55">
      <stop offset="0" stop-color="#7a4bb8" stop-opacity=".42"/>
      <stop offset=".5" stop-color="#4a2a7a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#4a2a7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-rose" cx=".82" cy=".3" r=".42">
      <stop offset="0" stop-color="#9c3f74" stop-opacity=".22"/>
      <stop offset="1" stop-color="#9c3f74" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tunnel" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#020709"/>
      <stop offset=".45" stop-color="#041017"/>
      <stop offset=".85" stop-color="#0b3540"/>
      <stop offset="1" stop-color="#16565f"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f3d45"/>
      <stop offset=".35" stop-color="#082129"/>
      <stop offset="1" stop-color="#030a10"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="ripple" width="512" height="7" patternUnits="userSpaceOnUse">
      <rect width="512" height="5" fill="#fff"/>
      <rect y="5" width="512" height="2" fill="#fff" opacity=".38"/>
    </pattern>
    <mask id="reflection-mask" maskUnits="userSpaceOnUse" x="0" y="330" width="512" height="182">
      <rect x="0" y="330" width="512" height="182" fill="url(#fade)"/>
      <rect x="0" y="330" width="512" height="182" fill="url(#ripple)" style="mix-blend-mode: multiply"/>
    </mask>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="haze-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <g id="nebula">
      <rect width="512" height="512" fill="url(#nebula-violet)"/>
      <rect width="512" height="512" fill="url(#nebula-rose)"/>
    </g>
    <g id="stars" fill="#dfeeff">
      <circle cx="81" cy="257" r="1.6" opacity="0.36"/>
      <circle cx="456" cy="266" r="1.0" opacity="0.82"/>
      <circle cx="448" cy="212" r="1.1" opacity="0.60"/>
      <circle cx="72" cy="48" r="2.3" opacity="0.66"/>
      <circle cx="120" cy="53" r="2.0" opacity="0.46"/>
      <circle cx="314" cy="59" r="2.3" opacity="0.36"/>
      <circle cx="203" cy="22" r="1.4" opacity="0.33"/>
      <circle cx="97" cy="48" r="1.1" opacity="0.45"/>
      <circle cx="216" cy="25" r="1.3" opacity="0.47"/>
      <circle cx="477" cy="184" r="2.0" opacity="0.72"/>
      <circle cx="83" cy="104" r="1.4" opacity="0.75"/>
      <circle cx="472" cy="177" r="2.3" opacity="0.66"/>
      <circle cx="118" cy="75" r="2.3" opacity="0.60"/>
      <circle cx="33" cy="110" r="1.5" opacity="0.75"/>
      <circle cx="450" cy="108" r="1.9" opacity="0.26"/>
      <circle cx="152" cy="60" r="1.0" opacity="0.48"/>
      <circle cx="49" cy="81" r="1.1" opacity="0.74"/>
      <circle cx="483" cy="92" r="1.9" opacity="0.34"/>
      <circle cx="49" cy="221" r="2.0" opacity="0.74"/>
      <circle cx="478" cy="167" r="1.1" opacity="0.75"/>
      <circle cx="56" cy="187" r="1.2" opacity="0.54"/>
      <circle cx="182" cy="19" r="1.6" opacity="0.32"/>
      <circle cx="112" cy="96" r="1.5" opacity="0.77"/>
      <circle cx="458" cy="133" r="1.1" opacity="0.66"/>
      <circle cx="371" cy="80" r="2.1" opacity="0.77"/>
      <circle cx="448" cy="132" r="1.2" opacity="0.55"/>
      <circle cx="430" cy="128" r="1.9" opacity="0.35"/>
      <circle cx="155" cy="32" r="1.4" opacity="0.35"/>
      <circle cx="457" cy="143" r="1.1" opacity="0.80"/>
      <circle cx="186" cy="45" r="1.3" opacity="0.71"/>
      <circle cx="426" cy="308" r="2.0" opacity="0.49"/>
      <circle cx="73" cy="293" r="1.2" opacity="0.39"/>
      <circle cx="232" cy="38" r="1.5" opacity="0.52"/>
      <circle cx="104" cy="281" r="1.9" opacity="0.63"/>
    </g>

    <!-- water -->
    <rect y="330" width="512" height="182" fill="url(#water)"/>
    <g id="reflection" mask="url(#reflection-mask)" opacity=".78" filter="url(#soften)">
      <g transform="translate(0 660) scale(1 -1)">
        <circle cx="256" cy="206" r="124" fill="none" stroke="#6de9d1" stroke-width="30" opacity=".5" filter="url(#glow)"/>
        <circle cx="256" cy="206" r="124" fill="none" stroke="#8ff0dd" stroke-width="13"/>
      </g>
    </g>
    <g id="ripples" fill="none" stroke="#6de9d1" stroke-linecap="round" opacity=".28">
      <path d="M64 372h56M392 372h58" stroke-width="2"/>
      <path d="M84 406h40M388 406h44" stroke-width="2"/>
      <path d="M48 444h30M432 444h32" stroke-width="1.6"/>
    </g>
    <rect y="329" width="512" height="2" fill="#a9f5e6" opacity=".45"/>

    <!-- flume mouth -->
    <circle id="mouth" cx="256" cy="206" r="124" fill="url(#tunnel)"/>
    <g id="arcs" fill="none" stroke="#6de9d1" stroke-linecap="round">
      <circle cx="262" cy="214" r="92" stroke-width="3" opacity=".34"/>
      <circle cx="267" cy="220" r="64" stroke-width="2.4" opacity=".24"/>
      <circle cx="271" cy="225" r="40" stroke-width="2" opacity=".16"/>
      <circle cx="274" cy="229" r="20" stroke-width="1.6" opacity=".11"/>
    </g>
    <circle id="haze" cx="256" cy="206" r="124" fill="none" stroke="#5be0c7" stroke-width="44" opacity=".72" filter="url(#haze-blur)"/>
    <circle id="bloom" cx="256" cy="206" r="124" fill="none" stroke="#6de9d1" stroke-width="22" opacity=".95" filter="url(#glow)"/>
    <circle id="ring" cx="256" cy="206" r="124" fill="none" stroke="#7cf0da" stroke-width="12"/>
    <circle id="hot" cx="256" cy="206" r="124" fill="none" stroke="#f1fffb" stroke-width="4"/>
  </g>
</svg>
