name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run verify:ci
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 1

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Browser checks run locally on pre-push; hosted runs are opt-in only.
  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      NIGHTWATER_REALTIME: "0"
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run test:browser
      - run: npm run test:integration
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-check
          path: artifacts
          if-no-files-found: ignore

  deploy:
    if: >-
      ${{ !cancelled() &&
          needs.check.result == 'success' &&
          needs.secrets.result == 'success' &&
          (needs.browser.result == 'success' ||
           (github.event_name != 'workflow_dispatch' && needs.browser.result == 'skipped')) &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [check, secrets, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist
      - run: npx --yes wrangler@4.131.1 pages deploy dist --project-name nightwater --branch "$BRANCH" --commit-hash "$COMMIT"

  smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      NIGHTWATER_URL: https://math.oddessentials.ai
      NIGHTWATER_MUSIC_URL: https://audio.oddessentials.ai/nightwater
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: node scripts/music-check.mjs
      - run: node scripts/lifecycle-check.mjs
      - run: node scripts/album-check.mjs
